{% extends "base.html" %}

{% block title %}{{ 'Редактировать' if debtor else 'Новый должник' }} — 22 Market Phone{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <a href="{{ url_for('debtors.list_debtors') }}" class="text-decoration-none small text-muted">
            &larr; К списку должников
        </a>

        <div class="card shadow-sm mt-2">
            <div class="card-body">
                <h1 class="h4 mb-4">
                    {{ 'Редактировать должника' if debtor else 'Новый должник' }}
                </h1>

                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">ФИО</label>
                        <input type="text" name="full_name" class="form-control" required
                               value="{{ form_data.get('full_name', '') }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Телефон</label>
                        <input type="text" name="phone" class="form-control"
                               value="{{ form_data.get('phone', '') }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Дата займа</label>
                        <input type="date" name="loan_date" class="form-control"
                               value="{{ form_data.get('loan_date_raw', '') }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Заметка</label>
                        <textarea name="note" class="form-control" rows="3">{{ form_data.get('note', '') }}</textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-grow-1">Сохранить</button>
                        <a href="{{ url_for('debtors.list_debtors') }}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
