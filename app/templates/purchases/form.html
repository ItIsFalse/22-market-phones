{% extends "base.html" %}

{% block title %}Новая закупка — 22 Market Phone{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-5">
        <a href="{{ url_for('purchases.list_purchases') }}" class="text-decoration-none small text-muted">
            &larr; К списку закупок
        </a>

        <div class="card shadow-sm mt-2">
            <div class="card-body p-3">
                                <h1 class="h6 mb-4">Новая закупка</h1>

                <form method="post">
                    <div class="section-block">
                        <h2 class="section-title">Дата закупки</h2>
                        <div class="row g-2">
                            <div class="col-md-4">
                                <label class="form-label small mb-0">Дата</label>
                                <input type="date" name="purchased_at"
                                       class="form-control form-control-sm"
                                       value="{{ form_data.get('purchased_at_raw', '') or today_str }}">
                            </div>
                        </div>
                    </div>

                    <div class="section-block">
                        <h2 class="section-title">Продавец</h2>
                        <div class="row g-2">
                            <div class="col-md-6">
                                <label class="form-label small mb-0">Имя / отметка</label>
                                <input type="text" name="client_name" class="form-control form-control-sm"
                                       value="{{ form_data.get('client_name', '') }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small mb-0">Контакт</label>
                                <input type="text" name="client_contact" class="form-control form-control-sm"
                                       value="{{ form_data.get('client_contact', '') }}">
                            </div>
                        </div>
                    </div>

                    <div class="section-block">
                        <h2 class="section-title">Телефон</h2>
                        <div class="row g-2">
                            <div class="col-md-6">
                                <label class="form-label small mb-0">
                                    Бренд <span class="text-danger">*</span>
                                </label>
                                <input type="text" name="brand" class="form-control form-control-sm" required
                                       value="{{ form_data.get('brand', '') }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small mb-0">
                                    Модель <span class="text-danger">*</span>
                                </label>
                                <input type="text" name="model" class="form-control form-control-sm" required
                                       value="{{ form_data.get('model', '') }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small mb-0">Цвет</label>
                                <input type="text" name="color" class="form-control form-control-sm"
                                       value="{{ form_data.get('color', '') }}">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small mb-0">Память</label>
                                <input type="text" name="storage" class="form-control form-control-sm"
                                       value="{{ form_data.get('storage', '') }}">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small mb-0">Батарея</label>
                                <input type="text" name="battery" class="form-control form-control-sm"
                                       value="{{ form_data.get('battery', '') }}">
                            </div>
                            <div class="col-md-9">
                                <label class="form-label small mb-0">IMEI</label>
                                <input type="text" name="imei" class="form-control form-control-sm"
                                       value="{{ form_data.get('imei', '') }}">
                            </div>
                            <div class="col-md-3 d-flex align-items-end">
                                <div class="form-check">
                                    <input type="checkbox" name="has_box" class="form-check-input" id="has_box"
                                           {% if form_data.get('has_box') %}checked{% endif %}>
                                    <label class="form-check-label small" for="has_box">Коробка</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="section-block">
                        <h2 class="section-title">Оплата</h2>
                        <div class="row g-2">
                            <div class="col-md-4">
                                <label class="form-label small mb-0">
                                    Цена <span class="text-danger">*</span>
                                </label>
                                <input type="text" name="price" class="form-control form-control-sm" required
                                       value="{{ form_data.get('price_raw', '') }}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small mb-0">
                                    Валюта <span class="text-danger">*</span>
                                </label>
                                <select name="currency" class="form-select form-select-sm" required id="currency_select">
                                    <option value="USD" {% if form_data.get('currency') == 'USD' %}selected{% endif %}>USD</option>
                                    <option value="UZS" {% if form_data.get('currency') == 'UZS' %}selected{% endif %}>UZS</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small mb-0">
                                    Касса <span class="text-danger">*</span>
                                </label>
                                <select name="cash_account_id" class="form-select form-select-sm" required
                                        id="cash_account_select"
                                        data-default-usd="{{ default_usd_id }}"
                                        data-default-uzs="{{ default_uzs_id }}">
                                    <option value="">— выберите —</option>
                                    {% for acc in accounts %}
                                        <option value="{{ acc.id }}"
                                            {% if form_data.get('cash_account_id') == acc.id %}selected{% endif %}
                                            data-currency="{{ acc.currency }}">
                                            {{ acc.name }} ({{ acc.currency }})
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small mb-0">Заметка</label>
                        <textarea name="note" class="form-control form-control-sm" rows="2">{{ form_data.get('note', '') }}</textarea>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-sm btn-primary flex-grow-1">Сохранить</button>
                        <a href="{{ url_for('purchases.list_purchases') }}" class="btn btn-sm btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
